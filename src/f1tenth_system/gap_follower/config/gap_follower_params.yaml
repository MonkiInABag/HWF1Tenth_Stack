gap_follower_node:
  ros__parameters:
    max_scan_distance: 12.0
    depth_threshold: 1.5
    max_speed: 2.5
    min_speed: 2.0

path_follower_node:
  ros__parameters:
    path_topic: /global_centerline
    ekf_odom_topic: /odometry/filtered
    scan_topic: /scan
    drive_topic: /drive
    path_frame: map
    base_frame: base_link
    use_tf_pose: true

    lookahead_distance: 0.8
    wheelbase: 0.25
    max_steering_angle: 0.5
    closed_loop_path: true
    force_closed_path: false
    reverse_path: false
    closest_search_back_points: 25
    closest_search_ahead_points: 500
    lookahead_min_forward_x: 0.05
    max_lookahead_target_distance: 3.0
    enable_path_error_correction: false
    heading_error_gain: 0.0
    crosstrack_error_gain: 0.0
    crosstrack_softening_speed: 0.5

    max_speed: 2.2
    min_speed: 1.2
    local_planner_speed: 1.2
    steering_smoothing: 0.25
    steering_deadband: 0.03

    enable_local_planner: true
    max_scan_distance: 12.0
    avoid_distance: 1.2
    blocker_distance: 0.55
    stop_on_blocker: true
    depth_threshold: 1.5
    front_fov_degrees: 35.0
    gap_fov_degrees: 140.0
    bubble_radius_beams: 20
    local_steering_blend: 1.0
    wall_avoidance_gain: 0.0
    enable_boundary_safety: false
    boundary_safety_distance: 0.4
    boundary_safety_speed: 0.08
    boundary_steering_blend: 0.9
    boundary_escape_steering: 0.5
    odom_timeout_sec: 0.5
