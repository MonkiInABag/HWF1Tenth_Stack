slam_toolbox:
  ros__parameters:
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping

    max_laser_range: 30.0

    # Relaxed for quality over speed
    minimum_travel_distance: 0.05
    minimum_travel_heading: 0.08
    minimum_time_interval: 0.2

    # Loop closure focused
    loop_search_maximum_distance: 8.0
    correlation_search_space_dimension: 0.8
    loop_search_minimum_response_coarse: 0.12
    loop_search_minimum_response_fine: 0.45
    do_loop_closing: true

    solver_plugin: solver_plugins::CeresSolver
    ceres_loss_function: HuberLoss
    use_scan_matching: true
    use_scan_barycenter: true

    map_update_interval: 0.5
    scan_queue_size: 80
    tf_buffer_duration: 120.0
    transform_tolerance: 1.0
    transform_publish_period: 0.01

    debug_logging: true
    enable_interactive_mode: true
