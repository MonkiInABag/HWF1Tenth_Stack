slam_toolbox:
  ros__parameters:
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: localization

    resolution: 0.015
    max_laser_range: 30.0

    minimum_travel_distance: 0.02
    minimum_travel_heading: 0.03
    minimum_time_interval: 0.1

    loop_search_maximum_distance: 8.0
    correlation_search_space_dimension: 5.0
    correlation_search_space_resolution: 0.005
    correlation_search_space_smear_deviation: 0.05
    coarse_search_angle_offset: 3.14
    coarse_angle_resolution: 0.026
    loop_search_minimum_response_coarse: 0.04
    loop_search_minimum_response_fine: 0.35

    do_loop_closing: false
    use_scan_matching: true
    use_scan_barycenter: true

    map_update_interval: 4.0
    scan_queue_size: 100
    tf_buffer_duration: 300.0
    transform_tolerance: 0.6
    transform_publish_period: 0.02

    debug_logging: true
    enable_interactive_mode: true
    minimum_laser_range: 0.1
