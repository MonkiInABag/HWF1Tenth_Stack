slam_toolbox:
  ros__parameters:
    mode: localization

    map_update_interval: 5.0
    minimum_travel_distance: 0.05
    minimum_travel_heading: 0.1
    minimum_time_interval: 0.2

    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    debug_logging: true
    # enable_interactive_mode: false
