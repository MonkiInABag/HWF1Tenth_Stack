slam_toolbox:
  ros__parameters:
    mode: localization

    enable_interactive_mode: true
    map_update_interval: 5.0
    minimum_travel_distance: 0.05
    minimum_travel_heading: 0.1
    minimum_time_interval: 0.2
    do_loop_closing: false
    use_scan_matching: true
    # ← THESE ARE THE IMPORTANT LINES FOR YOUR HEADING OFFSET
    correlation_search_space_dimension: 2.0
    correlation_search_space_resolution: 0.05
    correlation_search_space_smear_deviation: 0.1
    coarse_search_angle_offset: 1.57        # 90° search range
    coarse_angle_resolution: 0.1745         # coarse steps
    transform_publish_period: 0.02
    transform_tolerance: 0.5
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    debug_logging: true
